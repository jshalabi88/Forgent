<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job time clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E4E2DC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --field:#E4E2DC; --panel:#FFFFFF; --ink:#191D21; --ink-soft:#5C6268;
    --rule:#B6B1A7; --rule-hair:#D6D2C9;
    --run:#1B6B45; --run-lite:#E3F0E9; --halt:#B23320; --amber:#C98A0E;
    --shadow:0 1px 0 #FFF inset, 0 2px 6px rgba(25,29,33,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    background:var(--field); color:var(--ink);
    font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  input{
    font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--rule);
    border-radius:3px;background:var(--panel);color:var(--ink);width:100%;
  }
  label{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 5px}

  .plate{
    position:relative;
    background:linear-gradient(176deg,#FDFDFC 0%,#EFEDE8 58%,#E6E3DC 100%);
    border:1px solid var(--rule);border-radius:3px;padding:18px 22px 16px;box-shadow:var(--shadow);
  }
  .plate::before,.plate::after{
    content:"";position:absolute;top:9px;width:7px;height:7px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#FFF,#9E9A91);
  }
  .plate::before{left:9px} .plate::after{right:9px}
  .plate .kind{font-size:12px;color:var(--ink-soft);margin:0 0 2px}
  .plate .jobno{font-size:34px;font-weight:700;letter-spacing:.04em;line-height:1.05;margin:0;word-break:break-all}
  .plate .rules{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule-hair);height:3px;margin:12px 0 0}

  .readout{text-align:center;padding:34px 0 8px}
  .elapsed{font-size:68px;font-weight:700;letter-spacing:-.015em;line-height:1;margin:0}
  .elapsed.idle{color:#9A958B}
  .since{margin:10px 0 0;font-size:15px;color:var(--ink-soft)}
  .lamp{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#B9B5AC}
  .lamp.on{background:var(--run);box-shadow:0 0 0 4px var(--run-lite)}
  @media (prefers-reduced-motion:no-preference){.lamp.on{animation:pulse 2.6s ease-in-out infinite}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--run-lite)}50%{box-shadow:0 0 0 7px var(--run-lite)}}

  .bigbtn{
    display:block;width:100%;min-height:136px;margin:14px 0 0;border:none;border-radius:5px;
    color:#fff;font-size:30px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.22);
    transition:transform .08s ease, box-shadow .08s ease;-webkit-tap-highlight-color:transparent;
  }
  .bigbtn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.22)}
  .bigbtn.go{background:var(--run)} .bigbtn.stop{background:var(--halt)}
  .bigbtn .sub{display:block;font-size:15px;font-weight:400;opacity:.85;margin-top:5px}

  .btn{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:12px 16px;
       font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
  .btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.wide{width:100%}
  .btn.tiny{padding:7px 11px;font-size:13px;font-weight:500;box-shadow:none}
  .btn.ghost{background:transparent;box-shadow:none;border-color:var(--rule-hair)}
  .row{display:flex;gap:9px;flex-wrap:wrap}

  .sheet{background:var(--panel);border:1px solid var(--rule-hair);border-radius:4px;
         padding:16px;margin:16px 0 0;box-shadow:var(--shadow)}
  h2{font-size:19px;font-weight:600;margin:0 0 3px}
  .hint{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;max-width:62ch}
  .note{font-size:13px;color:var(--halt);margin:13px 0 0}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}
  .who{font-size:14px;color:var(--ink-soft)} .who b{color:var(--ink);font-weight:600}

  .sync{margin:18px 0 0;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:7px}
  .sync .dot{width:8px;height:8px;border-radius:50%;background:var(--run);flex:0 0 auto}
  .sync.pending .dot{background:var(--amber)}
  .sync.fail .dot{background:var(--halt)}

  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink-soft);padding:6px 8px 6px 0;border-bottom:1px solid var(--rule)}
  td{padding:9px 8px 9px 0;border-bottom:1px solid var(--rule-hair)}
  td.num{text-align:right;padding-right:0}

  .foot{margin:26px 0 0;padding-top:14px;border-top:1px solid var(--rule-hair);
        display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-soft)}
  .foot button{background:none;border:none;color:var(--ink-soft);text-decoration:underline;padding:4px 0;font-size:13px}
</style>
</head>
<body>

<!-- ============================================================
     SET THIS ONE LINE BEFORE YOU UPLOAD THE FILE
     postUrl is the "When an HTTP request is received" URL from
     your Power Automate flow. Leave it empty and the clock still
     works, but nothing leaves the phone.
     ============================================================ -->
<script>
const CONFIG = {
  postUrl: "",
  siteLabel: "Forgent Power"
};
</script>

<div class="wrap" id="app"></div>

<script>
/* ---------- storage: real browser storage, memory fallback ---------- */
const mem = {};
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const jget = (k,d) => { try{ const v = LS.get(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const jset = (k,v) => LS.set(k, JSON.stringify(v));

/* ---------- state ---------- */
let me      = LS.get('operator') || null;          // remembered on this phone, asked once
let openRec = jget('open', null);                  // the entry currently running
let queue   = jget('queue', []);                   // finished entries not yet delivered
let done    = jget('done', []);                    // local history, trimmed
let job     = null;
let ticker  = null;
let syncing = false;
let lastFail = false;

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function jobFromURL(){
  try{
    const q = new URLSearchParams(location.search).get('job');
    if(q) return q.trim();
    const h = new URLSearchParams(location.hash.replace(/^#/,'')).get('job');
    if(h) return h.trim();
  }catch(e){}
  return null;
}
function hms(ms){
  const t = Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
const hm = ms => { const t=Math.max(0,Math.floor(ms/60000)); return Math.floor(t/60)+'h '+String(t%60).padStart(2,'0')+'m'; };
const clk = iso => new Date(iso).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const isToday = iso => new Date(iso).toDateString() === new Date().toDateString();

/* ---------- delivery: queue first, network second ---------- */
async function flush(){
  if(syncing || !queue.length || !CONFIG.postUrl) return;
  syncing = true;
  try{
    while(queue.length){
      const entry = queue[0];
      const res = await fetch(CONFIG.postUrl, {
        method:'POST',
        // text/plain avoids a CORS preflight; the flow parses the body with Parse JSON
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body: JSON.stringify(entry)
      });
      if(!res.ok) throw new Error('HTTP ' + res.status);
      queue.shift();
      jset('queue', queue);
    }
    lastFail = false;
  }catch(e){
    lastFail = true;
  }finally{
    syncing = false;
    paintSync();
  }
}
setInterval(flush, 30000);
window.addEventListener('online', flush);

/* ---------- views ---------- */
const app = () => document.getElementById('app');

function render(){
  if(ticker){ clearInterval(ticker); ticker = null; }
  if(!me) return viewName();
  return viewClock();
}

function viewName(){
  app().innerHTML = `
    <div class="sheet">
      <h2>Who's on the clock?</h2>
      <p class="hint">${job
        ? 'Job ' + esc(job) + ' is loaded and waiting. Enter your name once — this phone remembers it, and every scan after this goes straight to the start button.'
        : 'Enter your name or badge number once. This phone will remember it.'}</p>
      <label for="nm">Name or badge number</label>
      <input id="nm" autocomplete="off" autocapitalize="words" placeholder="e.g. R. Delgado or 4417">
      <div class="row" style="margin-top:12px"><button class="btn dark wide" id="go">Continue</button></div>
    </div>
    <div class="foot"><span>${esc(CONFIG.siteLabel)} job clock</span><span></span></div>`;
  const i = document.getElementById('nm'); i.focus();
  const submit = () => {
    const v = i.value.trim(); if(!v) return i.focus();
    me = v; LS.set('operator', me); render();
  };
  document.getElementById('go').onclick = submit;
  i.onkeydown = e => { if(e.key === 'Enter') submit(); };
}

function viewClock(){
  const here  = openRec && openRec.job === job ? openRec : null;
  const other = openRec && openRec.job !== job ? openRec : null;
  const todayOnJob = done
    .filter(e => e.job === job && isToday(e.start))
    .reduce((a,e) => a + (new Date(e.stop) - new Date(e.start)), 0);

  app().innerHTML = `
    <div class="topbar">
      <span class="who">On the clock: <b>${esc(me)}</b></span>
      <button class="btn tiny" id="notme">Not you?</button>
    </div>

    ${job ? `
      <div class="plate">
        <p class="kind">Job</p>
        <p class="jobno">${esc(job)}</p>
        <div class="rules"></div>
      </div>

      <div class="readout">
        <p class="elapsed ${here?'':'idle'}" id="elapsed">${here ? hms(Date.now() - new Date(here.start)) : '0:00:00'}</p>
        <p class="since"><span class="lamp ${here?'on':''}"></span>${here ? 'Running since ' + clk(here.start) : 'Stopped'}</p>
      </div>

      <button class="bigbtn ${here?'stop':'go'}" id="big">
        ${here ? 'Stop work' : 'Start work'}
        <span class="sub">on ${esc(job)}</span>
      </button>

      ${other ? `<p class="note">You are still running on ${esc(other.job)} since ${clk(other.start)}. Starting here stops it.</p>` : ''}
      ${todayOnJob ? `<p class="hint" style="margin:14px 0 0">Already logged on this job today: ${hm(todayOnJob)}</p>` : ''}

      <div class="row" style="margin-top:22px;justify-content:center">
        <button class="btn ghost tiny" id="clear">Work a different job</button>
      </div>
    ` : `
      <div class="sheet">
        <h2>Scan a job tag to begin</h2>
        <p class="hint">Use the camera app on your phone and point it at the QR tag on the traveler or the unit. No tag handy? Key the job number in below.</p>
        <label for="mj">Job number</label>
        <div class="row">
          <input id="mj" autocomplete="off" placeholder="24-1187-1" style="flex:1 1 auto">
          <button class="btn dark" id="mgo" style="flex:0 0 auto">Open</button>
        </div>
      </div>
    `}

    <div id="sync"></div>
    <div id="hist"></div>

    <div class="foot"><span>${esc(CONFIG.siteLabel)} job clock</span><span></span></div>`;

  const big = document.getElementById('big');
  if(big) big.onclick = toggle;
  document.getElementById('notme').onclick = () => {
    if(openRec && !confirm('You are still clocked in. Switching leaves the clock running. Continue?')) return;
    me = null; LS.del('operator'); render();
  };
  const cl = document.getElementById('clear');
  if(cl) cl.onclick = () => { job = null; render(); };
  const mgo = document.getElementById('mgo');
  if(mgo){
    const open = () => { const v = document.getElementById('mj').value.trim(); if(v){ job = v; render(); } };
    mgo.onclick = open;
    document.getElementById('mj').onkeydown = e => { if(e.key === 'Enter') open(); };
  }

  paintSync(); paintHist();
  if(here) ticker = setInterval(() => {
    const el = document.getElementById('elapsed');
    if(el && openRec) el.textContent = hms(Date.now() - new Date(openRec.start));
  }, 1000);
}

function paintSync(){
  const box = document.getElementById('sync');
  if(!box) return;
  if(!CONFIG.postUrl){
    box.innerHTML = `<div class="sync fail"><span class="dot"></span>Not connected to the office — entries are staying on this phone.</div>`;
    return;
  }
  if(!queue.length){
    box.innerHTML = `<div class="sync"><span class="dot"></span>All entries sent.</div>`;
    return;
  }
  box.innerHTML = `<div class="sync ${lastFail?'fail':'pending'}">
      <span class="dot"></span>${queue.length} ${queue.length===1?'entry':'entries'} waiting to send${lastFail?' — will retry automatically':''}.
    </div>`;
}

function paintHist(){
  const box = document.getElementById('hist');
  if(!box) return;
  const rows = done.slice().reverse().slice(0,10);
  if(!rows.length){ box.innerHTML = ''; return; }
  const total = done.filter(e => isToday(e.start))
                    .reduce((a,e) => a + (new Date(e.stop) - new Date(e.start)), 0);
  box.innerHTML = `<div class="sheet">
    <h2>Your recent time</h2>
    <p class="hint">Today across all jobs: ${hm(total)}</p>
    <table><tr><th>Job</th><th>When</th><th class="num">Time</th></tr>
      ${rows.map(e => `<tr><td><b>${esc(e.job)}</b></td>
        <td>${clk(e.start)}–${clk(e.stop)}</td>
        <td class="num">${hm(new Date(e.stop) - new Date(e.start))}</td></tr>`).join('')}
    </table></div>`;
}

/* ---------- the one action ---------- */
function toggle(){
  const now = new Date().toISOString();

  if(openRec){                                   // close whatever is running
    const rec = {
      job: openRec.job,
      operator: me,
      start: openRec.start,
      stop: now,
      hours: Math.round((new Date(now) - new Date(openRec.start)) / 36000) / 100,
      device: navigator.userAgent.slice(0,60)
    };
    done.push(rec);  if(done.length > 60) done = done.slice(-60);
    queue.push(rec);
    jset('done', done); jset('queue', queue);
    const wasHere = openRec.job === job;
    openRec = null; LS.del('open');
    if(wasHere){ flush(); render(); return; }    // that tap was a stop
  }

  openRec = {job: job, start: now};              // start here
  jset('open', openRec);
  flush(); render();
}

/* ---------- go ---------- */
job = jobFromURL() || (openRec ? openRec.job : null);
render();
flush();
</script>
</body>
</html>
